# ExternalDNS chart values for the e2e suite. The image is overridden by run.sh.
provider:
  name: webhook
  webhook:
    image:
      repository: external-dns-hostinger-webhook
      tag: e2e
      pullPolicy: Never
    env:
      - name: HOSTINGER_API_TOKEN
        value: e2e-token
      - name: HOSTINGER_API_URL
        value: http://fake-hostinger.e2e.svc.cluster.local
      # DOMAIN_FILTER is left unset so zones are discovered from the portfolio.
      - name: LOG_LEVEL
        value: debug
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

sources: [service]
namespaced: false
policy: sync
registry: txt
txtOwnerId: e2e
txtPrefix: "extdns-%{record_type}."
interval: 10s
logLevel: debug
extraArgs:
  publish-internal-services: true
