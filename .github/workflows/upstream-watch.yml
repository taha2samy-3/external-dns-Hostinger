# Weekly checks on things that change outside this repository:
#   - Hostinger's DNS zone and domain portfolio API (OpenAPI spec) drifting
#     from the snapshot the client was written against -> opens/updates an issue.
#   - A new ExternalDNS Helm chart release -> opens/updates an issue to bump
#     hack/external-dns-chart.version (used by e2e and the example values).
#   - New vulnerabilities in the latest published image -> results go to the
#     Security tab; fixes arrive via Dependabot + auto-release.
name: Upstream watch

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hostinger-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare Hostinger API with snapshot
        id: diff
        run: |
          hack/hostinger-api-snapshot.sh > /tmp/current.json
          if diff -u hack/hostinger-api.json /tmp/current.json > /tmp/api.diff; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The part of https://developers.hostinger.com/openapi/openapi.json this webhook uses no longer matches \`hack/hostinger-api.json\`."
            echo
            echo "Review the diff against \`internal/hostinger/client.go\`, then refresh the snapshot with \`hack/hostinger-api-snapshot.sh > hack/hostinger-api.json\`."
            echo
            echo '```diff'
            head -c 60000 /tmp/api.diff
            echo '```'
          } > body.md
          gh label create upstream-api --color D93F0B --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-api --state open --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Hostinger API changed" --label upstream-api --body-file body.md
          fi

  external-dns-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with latest ExternalDNS chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(cat hack/external-dns-chart.version)"
          latest="$(curl -fsSL --retry 3 https://kubernetes-sigs.github.io/external-dns/index.yaml |
            yq '.entries["external-dns"][0].version')"
          echo "pinned $pinned, latest $latest"
          [[ "$latest" == "$pinned" ]] && exit 0
          title="ExternalDNS chart $latest is available"
          body="Bump \`hack/external-dns-chart.version\` from $pinned to $latest; CI then runs the e2e suite and renders the example values against it."
          gh label create upstream-external-dns --color 1D76DB --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-external-dns --state open --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label upstream-external-dns --body "$body"
          fi

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Resolve latest image
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
      - name: Scan
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.img.outputs.ref }}
          fail-build: false
          only-fixed: true
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: published-image
