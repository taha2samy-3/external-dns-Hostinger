name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: shellcheck
        run: shellcheck test/e2e/run.sh hack/*.sh
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # The example values must stay valid against the ExternalDNS chart schema.
      - name: Render example values with the ExternalDNS chart
        run: |
          helm template external-dns external-dns \
            --repo https://kubernetes-sigs.github.io/external-dns/ \
            --version "$(cat hack/external-dns-chart.version)" \
            -f deploy/external-dns-values.yaml > /dev/null

  test:
    name: Unit + ExternalDNS sync tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Includes internal/server: ExternalDNS' own controller, TXT registry and
      # webhook client syncing against the in-memory Hostinger API.
      - name: Tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    name: Image build + scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify base image provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/verify-base-images.sh Dockerfile test/e2e/Dockerfile.fake
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: external-dns-hostinger-webhook:ci
          cache-from: type=gha
      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: external-dns-hostinger-webhook:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  e2e:
    name: E2E (kind, k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Node images published with kind v0.33.0.
        include:
          - k8s: "1.34"
            node: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - k8s: "1.36"
            node: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
          version: v0.33.0
      # The official ExternalDNS chart with this webhook as its sidecar, against
      # the fake Hostinger API: create (incl. apex and CNAME), steady state
      # without writes, update, delete, unmanaged records left alone.
      - name: Run e2e
        env:
          KIND_NODE_IMAGE: ${{ matrix.node }}
        run: test/e2e/run.sh
